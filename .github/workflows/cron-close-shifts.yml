# Drives /api/cron/close-shifts every 10 minutes.
#
# WHY THIS EXISTS RATHER THAN A VERCEL CRON
# -----------------------------------------
# The job does two time-sensitive things: it closes sessions whose shift has
# ended, and it detects phones that stopped reporting. Offline detection SKIPS
# sessions past their shift end (silence after work is expected, not a fault),
# so on a once-a-day schedule the sweep always ran after every shift had already
# finished and the alert could never fire at all — not late, never.
#
# Vercel's Hobby plan only permits daily crons; anything more frequent fails the
# deployment outright. vercel.json therefore keeps a daily run as a backstop and
# the real cadence lives here, where it is free.
#
# If the project moves to Vercel Pro, put "*/10 * * * *" back in vercel.json and
# delete this workflow — do not run both, or every sweep does its work twice.
name: close-shifts cron

on:
  schedule:
    # GitHub's minimum is 5 minutes, and runs are queued rather than guaranteed
    # on time — under load they can be several minutes late. That is fine here:
    # OFFLINE_AFTER_MS is 15 minutes, so even a delayed run still lands inside
    # the shift, which is the property that actually matters.
    - cron: "*/10 * * * *"
  # Lets you fire it by hand from the Actions tab when testing.
  workflow_dispatch:

# Never let a slow run overlap the next tick.
concurrency:
  group: close-shifts-cron
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          # --fail-with-body so a non-2xx fails the step AND shows the reason.
          # The endpoint is idempotent, so retrying a transient failure is safe.
          curl --silent --show-error --fail-with-body \
               --retry 3 --retry-delay 10 --retry-all-errors \
               --max-time 120 \
               -H "Authorization: Bearer $CRON_SECRET" \
               "$APP_URL/api/cron/close-shifts"
